<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explicación de flex</title>
    <style>
        .container{
            display: flex;
        }
        .element{
            padding: 30px;
            background-color: aquamarine;
            width: 33%;
            margin: 50px;
            border-radius: 20px;
            font-size: 36px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="element">E1</div>
        <div class="element">E2</div>
        <div class="element">E3</div>
    </main>

</body>
</html>
