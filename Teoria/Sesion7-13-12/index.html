<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explicación de flex</title>
    <style>
        .container{
            display: flex;
            background-color: black;
            justify-content: space-evenly;
            
        
        }
        .element{
            padding: 30px;
            background-color: aquamarine;
            margin: 50px;
            border-radius: 20px;
            font-size: 36px;
            font-weight: bold;
        }

        main img{
            width: 100px;
        }

        .avatar img{
            width: 80px;
            border: white solid 2px;
            border-radius: 40;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="element"><img src="https://e7.pngegg.com/pngimages/886/974/png-clipart-bond-street-tube-station-adidas-originals-font-japan-white-adidas.png" alt=""></div>
        <div class="element avatar"><img src="https://png.pngtree.com/png-vector/20220709/ourmid/pngtree-businessman-user-avatar-wearing-suit-with-red-tie-png-image_5809521.png" alt=""></div>
    </main>
    <section>
        <video src="mivideo">controls autoplay</video>
        <iframe src="<iframe width="941" height="539" src="https://www.youtube.com/embed/LmwPop3Pulg" title="FC Barcelona vs Real Madrid (5-0) 2010/2011 PARTIDO COMPLETO" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>" frameborder="0"></iframe>
        <video src=""></video>
    </section>
</body>
</html>
